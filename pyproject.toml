[project]
name = "ceval"
version = "0.1.0"
description = "Evaluation harness: mechanical vs model-summary compaction in pi"
requires-python = ">=3.14"
dependencies = [
  "numpy",
  "pandas",
  "statsmodels",
  "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
ceval = "ceval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["harness/src/ceval"]

[tool.pytest.ini_options]
testpaths = ["harness/tests"]
pythonpath = ["harness/src"]
